intensity_measure_types_and_levels = {"PGA": logscale(0.005, 3.0, 30)}
truncation_level = 3
maximum_distance = 400.0

[output]
export_dir = ./out_z60_mcf56_mmin65
individual_rlzs = true
mean = true
quantiles = 0.16 0.84
poes = 0.002105 0.000404
