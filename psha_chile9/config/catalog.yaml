# CAT stage: one id, location, depth, Mw with sigma and mechanism per earthquake (steps C1-C6)
run: cat-06
compare: ../psha_chile8/catalog/frozen/2026-11-17g/catalog_2026-11-17g.csv

inputs:
  sources: data/raw/catalog
  overrides: data/raw/catalog/manual/overrides_A6.csv
  duplicates: data/raw/catalog/manual/duplicates.csv
  named: data/raw/catalog/manual/named_events.csv
  arc: data/raw/outlines/intraarc.shp
  land: data/raw/catalog/land/ne_10m_land.shp
  sigma_x3: data/raw/catalog/depth_sigma/x3_depth_error_model.csv
  sigma_x1: data/raw/catalog/depth_sigma/t2_depth_sigma_used_for_L-d.csv

# frozen tables of 10-11 Nov (D-CAT-07): file date per source
frozen: {default: "2026-11-10", gccel: "2026-11-11"}

# collection box (D-CAT-06); the 17g model domain, kept as a column for the comparison
box: {lon: [-80.0, -60.0], lat: [-58.0, -15.5]}
domain_17g: {lon: [-78.5, -65.0], lat: [-58.0, -17.0]}

# C1 read: historical before 1904 (D-CAT-02)
read:
  cabello_before: 1904
  # largest native magnitude per record, for the window widths only; IDC mb left out (heaped)
  not_max: {agencies: [IDC, EIDC], type: mb}

# C2 match (D-CAT-08, 09, 11)
match:
  # best-located first: the reference member of an event is its first source here
  sources: [potin, gccel, iscehb, iscgem, centennial, csn, isc, comcat, csn_isc, gcmt, cabello]
  # attach order of single records: leftovers of the sources with identity links, then window-only sources
  stages: [iscehb, iscgem, centennial, comcat, csn_isc, gcmt, gccel, potin, csn, cabello]
  # agency solutions inside the ISC event that tie a record to it (identity links, Q-41)
  foreign:
    comcat: [NEIC, USCGS, NEIS, NEIC-US, GUC, SJA, LIM]
    gcmt: [GCMT]
    centennial: [CENT]
    csn: [GUC]
  id: {t: 1.5, d: 10.0}
  floor: {t: 10.0, d: 50.0}
  cap: {t: 120.0, d: 450.0}
  nopair: {t: 20.0, d: 100.0}
  n_min: 100
  # window factor by the largest native magnitude: [magnitude, factor]
  scale: [[6.0, 1.5], [7.0, 2.0], [8.0, 3.0]]
  old: {year: 1964, t: 60.0, d: 300.0}
  second_pass: {t: 10.0, d: 50.0}
  same_t: 2.0
  nearest: [[potin, csn_isc], [csn, potin], [gcmt, comcat], [csn, csn_isc], [gccel, isc]]
  # one-source events far from an ISC event of the same time (D-CAT-09, automatic)
  lone: {sources: [potin, csn], d: 50.0, m: 4.5, wide_t: 30.0, wide_d: 150.0}
  # single-agency ISC copies merged into the nearest multi-source event (D-CAT-09, automatic)
  isc_copy: {t: 10.0, d: 100.0}
  # Ruiz and Madariaga (2018): date fixes, +-1 day, 2 deg latitude, event M >= 5.5 (D-CAT-11)
  rm:
    days: 1
    lat: 2.0
    m_min: 5.5
    dates: {"Copiapo 1918": "1918-12-04", "Arauco 1975": "1975-05-10", "Copiapo 1983": "1983-10-04",
            "Antofagasta 1995": "1995-07-30", "Copiapo 1959": "1859-10-05", "Mejillones 1994": "1994-12-10"}

# Cabello from 1904: listed when no event lies within t s and d km (wide: within wide_t s), Q-38
cabello_check: {m: 6.0, t: 120.0, wide_t: 86400.0, d: 300.0}

# C3 locations and depths (D-CAT-12-14)
locate:
  # Potin first only where it measures well (Q-42, Pablo 20 Nov): 18-36 S, not the backarc, not under the flat
  # slab (flat_slab lat, Potin depth >= z); a Potin depth above potin_shallow takes the global order for the depth
  network: {lat: [-36.0, -18.0], from: 1982}
  flat_slab: {lat: [-33.0, -27.0], z: 70.0}
  potin_shallow: 30.0
  # the ISC slot takes an origin of the ISC event from these agencies only, in this order (Q-41, Pablo 20 Nov)
  isc_agencies: [ISC, NEIC, USCGS, NEIS, GFZ, GUC, SJA, LIM]
  # low-quality depths last, sigma = stated error but at least sigma_min (Q-42, Pablo 20 Nov)
  low_quality: {iscgem: [C], ehb3: [L3], sigma_min: 20.0}
  far_km: 50.0
  offshore_km: 20.0
  tele: [ehb1, ehb2, ehb3, isc, comcat]
  local: [potin, csn]
  tail: [ehb3, iscgem, cent_ehb, centennial, gcmt, cabello]
  # orders: inside the network, outside it, offshore depths, 1904-1963, before 1904
  inside: [potin, csn, gccel, ehb1, ehb2, isc, comcat, csn_isc, ehb3, iscgem, cent_ehb, centennial, gcmt, cabello]
  outside: [gccel, ehb1, ehb2, isc, comcat, potin, csn, csn_isc, ehb3, iscgem, cent_ehb, centennial, gcmt, cabello]
  sea: [gccel, ehb1, ehb2, potin, csn, isc, comcat, csn_isc, ehb3, iscgem, cent_ehb, centennial, gcmt, cabello]
  old: [cent_ehb, iscgem, isc, centennial, comcat, ehb1, ehb2, ehb3, gcmt, cabello]
  hist: [cabello, cent_ehb, iscgem, isc, centennial, comcat, ehb1, ehb2, ehb3, gcmt]
  old_before: 1964
  hist_before: 1904
  # before 1964 only depths their catalogue marks as constrained
  old_ok: {iscgem: [A, B], cent_ehb: [DEQ], centennial: [DEQ]}
  cent_ehb_years: [[1918, 1943], [1956, 2100]]
  never: [cabello]
  # default depths: 1 km bins k times above their neighbours, per agency and period, plus documented ones
  spikes: {k: 5, n_min: 300, n_spike: 10, share: 0.003}
  periods: [[1964, 1980], [1980, 2000], [2000, 2012], [2012, 2100]]
  forced: [[comcat, us, 10], [comcat, us, 33], [comcat, us, 35], [isc, ISC, 35], [iscgem, ISC-GEM, 15],
           [iscgem, ISC-GEM, 35], [iscehb, ISC-EHB L1, 10], [iscehb, ISC-EHB L1, 15], [iscehb, ISC-EHB L2, 10],
           [iscehb, ISC-EHB L2, 15]]
  # depth sigma (km): tables per source and depth range, floors (D-CAT-14)
  sigma:
    names: {"Potin et al.": potin, "CSN web": csn, "ISC-EHB L1": ehb1, "ISC-EHB L2": ehb2, "ISC prime": isc,
            "ComCat": comcat, "CSN in ISC": csn_isc, "ISC-GEM": iscgem, "Centennial": centennial,
            "GCMT hypocentre": gcmt}
    bins: [30.0, 70.0]
    labels: ["< 30 km", "30–70 km", "≥ 70 km"]
    n_min: 20
    x1_none: 25.0
    gccel: 3.0
    floor: 5.0
    offshore: 10.0
    old: 20.0

# mechanisms (D-CAT-16): GCMT, ComCat GCMT copies, W-phase, other tensors, nodal planes, ISC-GEM literature
mech:
  m0_tol: 0.10
  wphase: "(?i)(?:_mww$|_WCMT$|^moment-tensor:duputel)"
  gcmt_copy: "(?i)(?:_GCMT$|_HRV$|_gcmt$|_mwc$|gcmt)"

# C4 magnitudes (D-CAT-15, D-MAG-01-11)
magnitude:
  seed: 1
  sources: [gcmt, isc, csn, comcat, iscgem, centennial, cabello]
  coda: {types: [md, mc, c], agencies: [GUC, CSN, guc, "GUC;NEIC"], before: 1990}
  # W-phase and regional family, in order; the CSN Mw of the ISC Bulletin last (D-MAG-02, 06)
  wfam: [NEIC Mww, GUC Mwr, CSN web Mw, NEIC Mwr, GFZ Mw, CSN Mww]
  last: GUC MW
  m_hi: 5.4
  m_csn: 5.0
  # CSN regional Mw more than tol from the median of n or more other moment magnitudes: left out (D-MAG-06)
  reg: {scales: [GUC Mwr, CSN web Mw, GUC MW], others: [GCMT Mw, NEIC Mww, NEIC Mwr, NEIC Mwb, GFZ Mw, CSN Mww],
        tol: 0.3, n: 2}
  sigma_ref: {gcmt: 0.08, w: 0.10}
  bins: [4.5, 4.75, 5.0, 5.25, 5.5, 5.75, 6.0, 6.25, 6.5]
  gbins: [4.5, 4.75, 5.0, 5.25, 5.4]
  n_bin: 30
  flat: 0.05
  dmax: 0.5
  # GCMT below m_hi lowered by a line zero at m_hi, fitted from ramp_lo (D-MAG-02)
  ramp_lo: 4.75
  # relations (D-MAG-07)
  fit_min: 4.0
  n_all: 100
  n_line: 30
  min_side: 20
  n_fold: 5
  n_boot: 200
  knots: [4.6, 6.6, 0.1]
  kref: 5.5
  b_sat: 0.3
  s_max: 1.0
  grow: 0.1
  z_cut: 50.0
  z_nest: 150.0
  p_cut: 1990
  period_split: [ISC mb, NEIC mb]
  at: [4.5, 5.0, 5.5, 6.0]
  ml: GUC ML
  web_ml: CSN Ml
  web_mlv: CSN Mlv
  mb_family: [ISC mb, NEIC mb]
  # converted scales (D-MAG-04)
  proxy: "^(?:(?:ISC|NEIC) (?:mb|MS|MSZ|Ms_20)|GUC ML|CSN Mlv?|SJA ML)$"
  # surface-wave scales only for events not deeper than sw_z (D-MAG-05)
  sw: ".* [Mm][Ss]\\w*$"
  sw_z: 60.0
  priority: [NEIC Ms_20, ISC MS, NEIC MS, NEIC MSZ, GUC ML, CSN Ml, CSN Mlv, ISC mb, NEIC mb, SJA ML]
  # before 1976 (D-MAG-03); Centennial types: Mw 0, mB 1, Ms 2, untyped 3
  pre76: 1976
  old: [Centennial Mw, ISC-GEM direct, Centennial converted, ISC-GEM proxy]
  cent_types: {Mw: 0, mB: 1, Ms: 2, UK: 3}
  cab_before: 1904
  # Abe mB of the Centennial catalogue (D-CAT-15, Q-43, Pablo 20 Nov): deeper than sw_z, mB plus the median offset of
  # measured Mw - mB on deep pairs (slope 1); shallower or unknown depth, the next level, and only where nothing else
  # exists mB plus the offset with sigma abe_sigma_shallow. "abe1982" converts with Abe (1982) eqs. 5 and 7 (17g)
  abe: native
  abe_agency: ABE1
  abe_sigma: 0.3
  abe_sigma_shallow: 0.5
  # Centennial Mw values that are conversions by their authors (Pacheco and Sykes 1992, from Ms): not native (D-CAT-15)
  cent_not_native: [P&S]
  sigma: {rm: 0.2, iscgem: 0.2, cent: 0.25, mb: 0.3, cabello: 0.5}

# C5 overrides (D-CAT-17): property -> column, applied last
overrides:
  locate: [time, lon, lat, depth, strike1, dip1, rake1, strike2, dip2, rake2, exists, class_hint]
  magnitude: [mw]

# C8 check figures and the D-MAG-12 acceptance tests (ported from psha_chile8 magnitude_check.py)
checks:
  basemap: data/raw/basemaps/basemap_chile_gray/basemap_gray.tif
  scales: [ISC mb, NEIC mb, GUC ML, SJA ML, ISC MS, NEIC MS]
  regional: [GUC Mwr, CSN web Mw, NEIC Mwr]
  y0: 1964
  floors: [4.7, 5.8]
  b_range: 0.2
  b_periods: [2011, 1976]
  periods: [[1976, 1990], [1990, 2000], [2000, 2011], [2011, 2100]]
  rate_m: [5.0, 5.5]
  rate_tol: 0.15
  fit_lo: [5.0, 5.3]
  fit_hi: 6.5
  decl_m: 3.5
  band: 0.95
  reg_bins: [4.0, 4.25, 4.5, 4.75, 5.0, 5.25, 5.5]
  reg_from: 4.5
  reg_tol: 0.1
  reg_n: 20
  hist: [4.3, 5.6]
  hist_from: 4.5
  hist_z: 3.0
  bands: [4.5, 5.0, 5.5, 6.0, 7.0, 10.0]
  compare_periods: [1500, 1904, 1964, 1976, 2000, 2011, 2100]

# C7 classification (D-CLS-01 to 13): the built catalogue with class weights and sub-classes, on the DATA geometry
classify:
  run: cat-07
  catalog: runs/catalog/cat-06
  data: runs/data/data-07
  compare: ../psha_chile8/catalog/frozen/2026-11-17g/catalog_2026-11-17g.csv
  slab: "data/raw/slab2/sam_slab2_{k}_02.23.18_2026-11-15.xyz"
  # nearest Slab2 node within this many km at the sides of the grid
  slab_km: 15.0
  pb2002: data/raw/trenches/pb2002_antarctic_trench_2026-11-15.geojson
  faults: data/raw/faults/faults_gem_extra_2026-11-15.shp
  sig_min: 5.0
  # a class with this weight or more becomes 1 (D-CLS-05)
  hard: 0.8
  # an event of this Mw or more without a measured depth is interface (D-CAT-23)
  m_interface: 8.0
  # historical events without a depth over the interface or in the forearc: no crustal share (D-CLS-06)
  old: 1904

  # interface: a band on the slab top where the top is not deeper than `top` (D-CLS-08), centred at Slab2 + offset
  # with half-width w (Q-69); mechanism misfit to the slab plane slipping along `az`, tolerances `tol` (swing, twist,
  # degrees), inside it the interface odds times lr, outside it no interface (D-CLS-04)
  interface:
    top: 60.0
    offset: 0.0
    w: 15.0
    tol: [20.0, 45.0]
    az: 257.0
    lr: 3.9
    # Antarctic interface (D-CLS-07): south of south_lat, within `width` km east of the AN\SA trench, not deeper than
    # z, no mechanism other than reverse (rake range)
    antarctic: {name: "AN\\SA", south_lat: -45.55, width: 150.0, z: 60.0, rake: [45.0, 135.0]}

  # crustal: above cap; scores after Haynie et al. (2026): fading from diff[0] above to diff[1] below the slab top
  # and from the Moho down to the slab top; nq quantiles of the depth error
  crustal:
    cap: 50.0
    diff: [-20.0, 20.0]
    moho: 40.0
    nq: 61
    assigned_z: 10.0

  # in-slab sub-classes (D-CLS-07); assigned depth at frac of the thickness below the top
  inslab:
    shallow_top: 50.0
    nest: {lon: -66.9, lat: -24.0, radius_deg: 0.8, depth: [150.0, 320.0]}
    deep: 300.0
    frac: 0.30
    deep_rej: 70.0

  # outer rise (D-CLS-09): shallow, west of the edge or between it and the crustal area; Scotia-Antarctic: no slab,
  # outside the crustal area, nearer to `scotia` than to the Antarctic trench and the Magallanes-Fagnano traces
  outer_rise:
    scotia: SC/AN
    mf: [CL-056b, CL-056c, CL-056d, AR-0056a, AR-0056b, AR-0056d, AR-0056g]

  # no measured depth: shares of the classified events (Mw >= m_min, from `from`) of the same bin, at least n per
  # bin (D-CLS-06, 13); the first slab-top bin ends at interface.top
  shares:
    top: [100.0]
    lat: [24.0, 30.0, 38.0]
    mag: [5.5]
    from: 1976
    m_min: 4.5
    n: 30
  sig_assigned: 20.0
  # D-CAT-23: events of Mw >= m whose class comes from a rule (no measured depth, or depth sigma >= sig)
  review: {m: 7.0, sig: 20.0}

# C8 classification check figures
class_checks:
  m_min: 4.5
  bands: [4.5, 5.5, 7.0, 10.0]
  best: [gccel, ehb1]
  tops: [0, 20, 40, 60, 80, 120]
  segments: [-17.1, -26.0, -32.0, -37.0, -45.55]
  n_boot: 1000
