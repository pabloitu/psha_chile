# conda-forge only (D-ENV-01); then: pip install -e . --no-deps
# freeze after any change: conda list --explicit --md5 > psha9-linux64.lock
name: psha9
channels:
  - conda-forge
channel_priority: strict
dependencies:
  - python=3.12
  - openquake.engine=3.26.2
  - geopandas
  - fiona
  - cartopy
  - rasterio
  - matplotlib
  - pyyaml
  - scikit-learn
  - pytest
  - pip
